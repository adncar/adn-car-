<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADN CAR Help</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>ADN CAR Help 🚗</h1>
  <h2>Solicitar Asistencia</h2>

  <input type="text" placeholder="Tu teléfono">
  <input type="text" placeholder="Tu ubicación">
  <input type="text" placeholder="Describe tu problema">

  <button onclick="enviarPedido()">Enviar Pedido</button>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const supabaseUrl = https://epulpwrjiuztkxygbezr.supabase.co
    const supabaseKey = sb_publishable_w5pO0E_xx0yc_tPUYiajFQ_Yk8KUxyH

    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    // 🔥 ESTA ES LA PARTE CORREGIDA
    window.enviarPedido = async function() {

      const telefono = document.querySelector('input[placeholder="Tu teléfono"]').value;
      const ubicacion = document.querySelector('input[placeholder="Tu ubicación"]').value;
      const problema = document.querySelector('input[placeholder="Describe tu problema"]').value;

      const { data, error } = await supabase
        .from('pedidos')
        .insert([
          { telefono: telefono, ubicacion: ubicacion, problema: problema }
        ]);

      if (error) {
        alert("Error al enviar pedido");
        console.error(error);
      } else {
        alert("Pedido enviado correctamente 🚗");
      }
    }
  </script>

</body>
</html>
