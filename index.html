<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>ADN CAR Help</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    input, button {
      display: block;
      margin: 10px 0;
      padding: 10px;
      width: 300px;
    }
  </style>
</head>
<body>

  <h2>Solicitar Asistencia</h2>

  <input type="text" id="telefono" placeholder="Tu teléfono">
  <input type="text" id="ubicacion" placeholder="Tu ubicación">
  <input type="text" id="problema" placeholder="Describe tu problema">
  <button onclick="enviarPedido()">Enviar Pedido</button>

  <p id="mensaje"></p>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseUrl = 'TU_URL_DE_SUPABASE';
const supabaseKey = 'TU_ANON_KEY';
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

async function enviarPedido() {

  const telefono = document.querySelector('input[placeholder="Tu teléfono"]').value;
  const ubicacion = document.querySelector('input[placeholder="Tu ubicación"]').value;
  const problema = document.querySelector('input[placeholder="Describe tu problema"]').value;

  const { data, error } = await supabase
    .from('pedidos')
    .insert([
      { telefono: telefono, ubicacion: ubicacion, problema: problema }
    ]);

  if (error) {
    alert("Error al enviar pedido");
    console.error(error);
  } else {
    alert("Pedido enviado correctamente 🚗");
  }
}
</script>
