<!DOCTYPE html>
<html>
<head>
  <title>ADN CAR Help</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="font-family: Arial; text-align: center; padding: 20px;">

  <h1>ADN CAR Help 🚗</h1>
  <h2>Solicitar asistencia</h2>

  <input type="text" id="nombre" placeholder="Nombre"><br><br>
  <input type="text" id="telefono" placeholder="Teléfono"><br><br>
  <input type="text" id="ubicacion" placeholder="Ubicación"><br><br>
  <textarea id="problema" placeholder="Describe el problema"></textarea><br><br>

  <button onclick="enviarPedido()">Enviar pedido</button>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const { createClient } = supabase;

    const supabaseClient = createClient(
      https://epulpwrjiuztkxygbezr.supabase.co/
      sb_publishable_w5pO0E_xx0yc_tPUYiajFQ_Yk8KUxyH
    );

    async function enviarPedido() {
      const nombre = document.getElementById("nombre").value;
      const telefono = document.getElementById("telefono").value;
      const ubicacion = document.getElementById("ubicacion").value;
      const problema = document.getElementById("problema").value;

      const { error } = await supabaseClient
        .from("pedidos")
        .insert([{ nombre, telefono, ubicacion, problema }]);

      if (error) {
        alert("Error al enviar pedido");
        console.log(error);
      } else {
        alert("Pedido enviado correctamente 🚗");
      }
    }
  </script>

</body>
</html>
