<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>ADN CAR Help</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    input, button {
      display: block;
      margin: 10px 0;
      padding: 10px;
      width: 300px;
    }
  </style>
</head>
<body>

  <h2>Solicitar Asistencia</h2>

  <input type="text" id="telefono" placeholder="Tu teléfono">
  <input type="text" id="ubicacion" placeholder="Tu ubicación">
  <input type="text" id="problema" placeholder="Describe tu problema">
  <button onclick="enviarPedido()">Enviar Pedido</button>

  <p id="mensaje"></p>

  <script>
    const supabaseUrl = "https://epulpwrjiuztkxygbezr.supabase.co";
    const supabaseKey = "sb_publishable_w5pO0E_xx0yc_tPUYiajFQ_Yk8KUxyH";

    const { createClient } = supabase;
    const db = createClient(supabaseUrl, supabaseKey);

    async function enviarPedido() {
      const telefono = document.getElementById("telefono").value;
      const ubicacion = document.getElementById("ubicacion").value;
      const problema = document.getElementById("problema").value;

      const { data, error } = await db
        .from("pedidos")
        .insert([
          { telefono, ubicacion, problema }
        ]);

      if (error) {
        document.getElementById("mensaje").innerText = "Error: " + error.message;
      } else {
        document.getElementById("mensaje").innerText = "Pedido enviado correctamente 🚗";
      }
    }
  </script>

</body>
</html>
